[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "respkv"
version = "0.1.0"
description = "Redis-compatible in-memory key-value server: asyncio event loop, RESP2, TTL expiry, AOF persistence"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "redis>=5", "ruff"]

[project.scripts]
respkv = "respkv.server:main"
respkv-bench = "respkv.bench:main"

[tool.setuptools]
packages = ["respkv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E741"]
